# Builds the Assignment 3 chatbot image, runs a scripted chat and shows the
# transcript on the run's summary page, then publishes the image to GHCR so
# anyone can chat with it using `docker run -it --rm <image>`.
name: Assignment 3 chatbot

on:
  push:
    branches: [main]
    paths:
      - "Assignment_3/**"
      - ".github/workflows/assignment3-chatbot.yml"
  pull_request:
    paths:
      - "Assignment_3/**"
      - ".github/workflows/assignment3-chatbot.yml"
  workflow_dispatch:
    inputs:
      messages:
        description: "Messages to send to the bot, separated by |"
        required: false
        default: ""

permissions:
  contents: read

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/sarathyponnapalli/assignment3-chatbot

jobs:
  demo:
    name: Build and chat
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: Assignment_3
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sample dialog from the brief
        run: |
          printf '%s\n' "Good morning! How are you doing?" "You're welcome." exit \
            | docker run -i --rm "$IMAGE:latest" | tee sample.txt
          grep -qx "bot: I am doing very well, thank you for asking." sample.txt
          grep -qx "bot: Do you like hats?" sample.txt

      - name: Chat transcript
        env:
          # Passed through env, not interpolated into the script, so input
          # text can't inject shell commands.
          MESSAGES: ${{ inputs.messages }}
        run: |
          if [ -z "$MESSAGES" ]; then
            MESSAGES="Good morning! How are you doing?|You're welcome.|yes|Black ones|What is 7 times 6?|Tell me a joke|What can you do?"
          fi
          { printf '%s\n' "$MESSAGES" | tr '|' '\n'; echo exit; } \
            | docker run -i --rm "$IMAGE:latest" | tee transcript.txt
          {
            echo "## Chat transcript"
            echo
            echo '```text'
            cat transcript.txt
            echo '```'
            echo
            echo "Chat with it yourself: \`docker run -it --rm $IMAGE:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:latest"
